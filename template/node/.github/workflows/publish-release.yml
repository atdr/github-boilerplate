name: publish-release

on:
  push:
    branches: [main]
  # Daily as well: an auto-merged Dependabot bump is pushed by GITHUB_TOKEN,
  # which starts no push workflow. 04:47 UTC is off the top of the hour, when
  # GitHub delays scheduled runs. A run with nothing new changes nothing.
  schedule:
    - cron: '47 4 * * *'

# Scoped per job: the publish job must not hold a writable contents token.
permissions: {}

# Queued, never cancelled: a publish stopped halfway can leave a tag with no
# package behind it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Inline release-type until the repo needs a release-please-config.json
      # (extra-files, pre-1.0 bump rules, several packages).
      #
      # The release PR is opened with the default GITHUB_TOKEN, so its
      # pull_request runs are created but held for "Approve and run". Branch
      # protection requires them, so approve them before merging.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  # Gated on release-please's own output rather than a separate `on: release`
  # workflow: release-please runs with the default GITHUB_TOKEN, and GitHub
  # starts no workflow run from events that token creates, so a
  # release-triggered workflow would never fire and never report an error
  # either.
  #
  # Installs, builds and packs in its own job, so no dependency's install
  # script runs where an npm credential can be minted. `npm pack` runs the
  # package's prepack and prepare scripts; prepublishOnly never runs, so a
  # build kept there belongs in prepack.
  build:
    name: pack the package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Outside the checkout: the package's own scripts may build into dist/.
      - run: mkdir "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  # In this file, not a reusable workflow: npm's trusted publisher names the
  # workflow file that publishes, and that has to be the caller's.
  #
  # Installs and builds nothing: it publishes the tarball the build job packed,
  # and npm runs no package scripts when it publishes a tarball.
  publish:
    name: publish to npm
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Scopes the OIDC token so npm's trusted publisher can require it. The url
    # puts a link to the published version on the deployment.
    environment:
      name: npm-release
      url: ${{ steps.publish.outputs.url }}
    permissions:
      # OIDC for npm trusted publishing; provenance is automatic. Nothing
      # else: there is no checkout, and the artifact downloads with the
      # runner's own token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist/
      - uses: actions/setup-node@v7
        with:
          # trusted publishing needs npm >= 11.5.1, bundled with Node >= 24.5
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      # npm tags whatever it publishes 'latest' unless --tag is passed; it
      # infers nothing from a prerelease suffix. A prerelease only reaches this
      # job from a deliberate Release-As footer, so publish it under its own
      # identifier (1.2.0-beta.1 -> beta) rather than moving latest. The name
      # and version come from the packed package.json, which is what npm is
      # sent.
      - name: Publish
        id: publish
        env:
          # Only these publishConfig keys may come from the package.
          CHECK_PUBLISH_CONFIG: >-
            const extra = Object.keys(JSON.parse(process.argv[1]).publishConfig ?? {})
            .filter((key) => !["access", "tag", "provenance"].includes(key));
            if (extra.length) {
            console.log(`::error::the packed package.json sets publishConfig ${extra.join(", ")}, which only this workflow may set`);
            process.exit(1); }
        run: |
          set -- dist/*.tgz
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball from the build job, found: $*"
            exit 1
          fi
          manifest=$(tar -xzOf "$1" package/package.json)
          # npm applies the tarball's publishConfig, so a build step could
          # point the OIDC exchange at another registry or switch off TLS
          # checks. The registry and its trust settings come from this job.
          node -e "$CHECK_PUBLISH_CONFIG" "$manifest"
          name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
          version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
          case "$version" in
            *-*)
              tag=$(node -p 'process.argv[1].match(/-([a-z]+)/i)?.[1] ?? "next"' "$version")
              npm publish "$1" --tag "$tag"
              ;;
            *) npm publish "$1" ;;
          esac
          # After the publish, so a failed one links nowhere.
          echo "url=https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_OUTPUT"
