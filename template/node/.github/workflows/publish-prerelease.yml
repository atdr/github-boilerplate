name: publish-prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to publish, e.g. 1.2.0-beta.1'
        required: true
      dist_tag:
        description: "npm dist-tag to publish under (never 'latest')"
        required: true
        default: beta

permissions: {}

# Keyed by version: GitHub keeps one pending run per group and drops the
# older for a newer one, even with cancel-in-progress false, so a shared group
# would silently discard a second version dispatched while one is queued.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Installs, builds and packs in its own job, so no dependency's install
  # script runs where an npm credential can be minted. `npm pack` runs the
  # package's prepack and prepare scripts; prepublishOnly never runs, so a
  # build kept there belongs in prepack.
  build:
    name: pack the prerelease
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Read through the environment rather than inlined into the run scripts,
      # so a dispatch input can never be interpreted as shell.
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: Refuse a stable version or the latest dist-tag
        run: |
          case "$VERSION" in
            *-*) ;;
            *) echo "::error::'$VERSION' is not a prerelease version (expected a suffix, e.g. 1.2.0-beta.1)"; exit 1 ;;
          esac
          if [ "$DIST_TAG" = latest ]; then
            echo "::error::refusing to move the latest dist-tag"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Runner-local bump, never committed: main keeps its released version and
      # the pending release-please PR keeps proposing a clean next version.
      - run: npm version "$VERSION" --no-git-tag-version
      # Outside the checkout: the package's own scripts may build into dist/.
      - run: mkdir "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  # Installs and builds nothing: it publishes the tarball the build job packed,
  # and npm runs no package scripts when it publishes a tarball.
  publish-prerelease:
    name: publish prerelease to npm
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Scopes the OIDC token so npm's trusted publisher can require it. The url
    # puts a link to the published version on the deployment.
    environment:
      name: npm-prerelease
      url: ${{ steps.publish.outputs.url }}
    permissions:
      # OIDC for npm trusted publishing; provenance is automatic. Nothing
      # else: there is no checkout, and the artifact downloads with the
      # runner's own token.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Publish
        id: publish
        env:
          # Only these publishConfig keys may come from the package.
          CHECK_PUBLISH_CONFIG: >-
            const extra = Object.keys(JSON.parse(process.argv[1]).publishConfig ?? {})
            .filter((key) => !["access", "tag", "provenance"].includes(key));
            if (extra.length) {
            console.log(`::error::the packed package.json sets publishConfig ${extra.join(", ")}, which only this workflow may set`);
            process.exit(1); }
        run: |
          set -- dist/*.tgz
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball from the build job, found: $*"
            exit 1
          fi
          manifest=$(tar -xzOf "$1" package/package.json)
          # npm applies the tarball's publishConfig, so a build step could
          # point the OIDC exchange at another registry or switch off TLS
          # checks. The registry and its trust settings come from this job.
          node -e "$CHECK_PUBLISH_CONFIG" "$manifest"
          npm publish "$1" --tag "$DIST_TAG"
          # After the publish, so a failed one links nowhere.
          name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
          echo "url=https://www.npmjs.com/package/$name/v/$VERSION" >> "$GITHUB_OUTPUT"

  tag-prerelease:
    # Records which commit a beta was built from, so a report against
    # 1.2.0-beta.4 can be compared with `git log prerelease/1.2.0-beta.4..main`.
    # After the publish, so the tag only marks a version that reached npm, and
    # in its own job so the publishing job's token stays read-only.
    name: tag the published commit
    needs: publish-prerelease
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the published commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # A plain ref, never a GitHub Release: release-please reads the
        # Releases API to find the last release and does not filter out
        # prereleases, so a prerelease Release could become the base it bumps
        # from. The prerelease/ prefix keeps `git tag -l 'v*'` meaning released
        # versions.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/prerelease/$VERSION" \
            -f "sha=$GITHUB_SHA" >/dev/null
          echo "tagged $GITHUB_SHA as prerelease/$VERSION"
