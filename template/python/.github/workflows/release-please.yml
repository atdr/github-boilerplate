name: release-please

on:
  push:
    branches: [main]
  # Daily as well: an auto-merged Dependabot bump is pushed by GITHUB_TOKEN,
  # which starts no push workflow. 04:47 UTC is off the top of the hour, when
  # GitHub delays scheduled runs. A run with nothing new changes nothing.
  schedule:
    - cron: "47 4 * * *"

# Scoped per job: the publish job must not hold a writable contents token.
permissions: {}

# Queued, never cancelled: a publish stopped halfway can leave a tag with no
# package behind it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Inline release-type until the repo needs a release-please-config.json
      # (extra-files, pre-1.0 bump rules, several packages).
      #
      # The release PR is opened with the default GITHUB_TOKEN, so its
      # pull_request runs are created but held for "Approve and run". Branch
      # protection requires them, so approve them before merging.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python

  # Gated on release-please's own output: a release made with GITHUB_TOKEN
  # starts no `on: release` workflow.
  #
  # Builds in its own job, so the build backend and everything it pulls in
  # never run where a PyPI credential can be minted.
  build:
    name: build the distributions
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # In this file, not a reusable workflow: PyPI's trusted publisher names the
  # workflow file that publishes, and that has to be the caller's.
  #
  # Installs and builds nothing: it publishes the distributions the build job
  # made, exactly as they were uploaded.
  publish:
    name: publish to PyPI
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The url puts a link to the published version on the deployment, so the
    # environment's page shows what each run released.
    environment:
      name: pypi
      url: ${{ steps.published.outputs.url }}
    permissions:
      # No API token: PyPI trusts this workflow (owner/repo/environment) to
      # mint its own short-lived credential via OIDC. Nothing else: there is no
      # checkout, and the artifact downloads with the runner's own token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      # After the publish, so a failed one links nowhere. Read from the sdist,
      # <name>-<version>.tar.gz, which is what PyPI was sent: a version holds
      # no hyphen, so the last one splits the two.
      - name: Link the deployment to the published version
        id: published
        run: |
          sdist=$(basename dist/*.tar.gz .tar.gz)
          echo "url=https://pypi.org/project/${sdist%-*}/${sdist##*-}/" >> "$GITHUB_OUTPUT"
