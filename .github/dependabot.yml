version: 2
updates:
  # The actions in the reusable workflows and the template's workflows run in
  # every caller, so a bump here changes what they run and must cut a release:
  # `fix`, not `ci`. The template's workflow directories are listed one by one
  # because `/` covers .github/workflows only; tests/ fails if one is missing.
  - package-ecosystem: github-actions
    directories:
      - /
      - /template/core/.github/workflows
      - /template/node/.github/workflows
      - /template/python/.github/workflows
      - /template/tex/.github/workflows
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
    # The same cooldown the template sets: GitHub's default three days, with
    # atdr's own actions (atdr/latex-build in the TeX template) exempt.
    cooldown:
      default-days: 3
      exclude:
        - 'atdr/*'
    # Without this, one action bump opens a PR per directory above: five
    # `fix(deps)` changelog lines for one change, each needing a rebase after
    # the last merges. Grouped by dependency name, so each action is still its
    # own PR.
    groups:
      actions:
        group-by: dependency-name
  # Pins the reusable workflows install in callers (mdformat, PyYAML). Same
  # reasoning: a bump reaches every caller, so it releases.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
  # This repo's own test and lint tools. Nobody downstream runs them.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
