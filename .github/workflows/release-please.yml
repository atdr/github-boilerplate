name: release-please

on:
  push:
    branches: [main]
  # Daily as well: an auto-merged Dependabot bump is pushed by GITHUB_TOKEN,
  # which starts no push workflow. 04:47 UTC is off the top of the hour, when
  # GitHub delays scheduled runs. A run with nothing new changes nothing.
  schedule:
    - cron: "47 4 * * *"

permissions:
  contents: write
  pull-requests: write

# Queued, never cancelled: a release stopped halfway can leave a tag without
# its GitHub Release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # Merging the release PR tags vX.Y.Z, which callers pin their reusable
      # workflows to. The same PR rewrites the pins inside template/ (the
      # extra-files in release-please-config.json), so a repo built from a
      # release always pins that release.
      #
      # No moving major tag: it would carry an unreviewed change to every
      # caller at once. Callers pin exact tags and Dependabot proposes each
      # bump (STANDARDS.md, Pinning).
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
