name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Queued, never cancelled: a release stopped halfway can leave a tag without
# its GitHub Release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # Merging the release PR tags vX.Y.Z, which callers pin their reusable
      # workflows to. The same PR rewrites the pins inside template/ (the
      # extra-files in release-please-config.json), so a repo built from a
      # release always pins that release.
      #
      # No moving major tag while pre-1.0: a breaking change bumps the minor,
      # so a `v0` tag would carry breaking changes to every caller. Callers pin
      # exact tags and Dependabot proposes each bump.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
