# Reusable: CI for a Node package.
#
# Runs the caller's own npm scripts, so what CI checks is what `npm run` checks
# locally. Each script in `scripts` must exist: a missing one fails rather
# than being skipped, because a check that cannot fail proves nothing.
name: node-ci

on:
  workflow_call:
    inputs:
      node-versions:
        description: >-
          JSON array of Node versions to test, e.g. '["22.x", "24.x"]'. Empty
          tests every Node line currently in LTS.
        type: string
        default: ""
      scripts:
        description: npm scripts to run on every Node version, space separated
        type: string
        default: lint format:check test
      coverage:
        description: >-
          Run `npm run coverage` and upload lcov.info to Codecov. The script
          must write lcov.info at the repo root.
        type: boolean
        default: true
      audit:
        description: Run npm audit (production blocking, development advisory)
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  versions:
    name: resolve Node versions
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      # Read from the Node release schedule rather than hand-picked, so a line
      # leaving LTS drops out of every repo at once, and a new one joins.
      - id: resolve
        env:
          REQUESTED: ${{ inputs.node-versions }}
        run: |
          if [ -n "$REQUESTED" ]; then
            matrix=$REQUESTED
          else
            today=$(date -u +%F)
            matrix=$(curl --fail --silent --show-error --retry 3 \
              https://raw.githubusercontent.com/nodejs/Release/main/schedule.json \
              | jq -c --arg today "$today" '[to_entries[]
                  | select(.value.lts != null and .value.lts <= $today and .value.end > $today)
                  | .key | ltrimstr("v") | . + ".x"]')
          fi
          if [ "$(jq length <<< "$matrix")" -eq 0 ]; then
            echo "::error::no Node versions resolved"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Testing on $matrix"

  quality:
    # Interpolated, not a fixed string: a matrix job with a static name produces
    # several checks called the same thing.
    name: node ${{ matrix.node-version }}
    needs: versions
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run npm scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done

  # Reporting, not a gate: the matrix above is what proves the suite passes.
  # This re-runs it under instrumentation only to produce a report. Scope lives
  # in the `coverage` npm script rather than here, so a developer running it
  # locally measures what CI measures.
  coverage:
    name: coverage
    if: inputs.coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run coverage
      # Advisory only: a Codecov outage or a token missing from a fork says
      # nothing about the change under review. The coverage run itself stays
      # blocking, because a job that can never fail is a check that proves
      # nothing.
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Separate from the matrix: an audit result reflects the advisory database at
  # a point in time, not the diff under review, and advisories do not depend on
  # the Node version. --package-lock-only audits the resolved tree without an
  # install.
  audit:
    name: dependency audit
    if: inputs.audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Blocking: production dependencies are the ones that reach a user.
      - run: npm audit --audit-level=high --omit=dev --package-lock-only
      # Advisory: development tooling never ships. The step swallows the exit
      # code itself rather than using continue-on-error, which would leave the
      # runner's bare "Process completed with exit code 1" as the only
      # annotation. ::error rather than ::warning, so it is not scrolled past
      # with the deprecation notices; a Dependabot bump clears it.
      - name: audit development tree (advisory)
        run: |
          if ! npm audit --audit-level=high --package-lock-only; then
            echo "::error title=Development dependency advisory::npm audit found a high advisory in the development tree. This does not block: development dependencies never reach a user, and the job is green on purpose. Dependabot alerts are the signal of record; the report above says which package."
          fi
