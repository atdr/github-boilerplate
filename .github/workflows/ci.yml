name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A group per run outside pull requests, so no commit on main loses its run;
# see Concurrency in atdr/github-boilerplate STANDARDS.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # The template workflows too: they are what callers actually run.
      - run: actionlint .github/workflows/*.yml template/*/.github/workflows/*.yml

  shellcheck:
    name: shellcheck
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Preinstalled on GitHub's Ubuntu runners. Husky hooks carry no shebang,
      # so their shell is named.
      - run: shellcheck scripts/*.sh
      - run: shellcheck --shell=sh template/node/.husky/*

  test:
    name: pytest
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: >-
          pip install -r requirements-dev.txt
          -r scripts/requirements-conventions.txt
          -r scripts/requirements-markdown.txt
      - run: pytest -q

  # The scripts are written for bash 3.2, macOS's /bin/bash, which treats an
  # empty array as unbound under set -u. Ubuntu's bash 5 never sees that, and
  # the shebang would find Homebrew's newer bash on macOS too, so the tests
  # run apply.sh through $APPLY_BASH.
  test-bash32:
    name: pytest (bash 3.2)
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Confirm /bin/bash is 3.2
        run: /bin/bash -c '[[ $BASH_VERSION == 3.2.* ]] || { echo "::error::/bin/bash is $BASH_VERSION"; exit 1; }'
      - run: >-
          pip install -r requirements-dev.txt
          -r scripts/requirements-conventions.txt
          -r scripts/requirements-markdown.txt
      - run: pytest -q
        env:
          APPLY_BASH: /bin/bash

  # Node repos run Prettier over everything it understands, YAML included, with
  # the overlay's own .prettierrc.json. A template file Prettier would rewrite
  # fails `format:check` in every repo that applies it.
  prettier:
    name: prettier
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply the Node overlay
        run: |
          mkdir "$RUNNER_TEMP/node"
          scripts/apply.sh node "$RUNNER_TEMP/node"
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check it is Prettier clean
        working-directory: ${{ runner.temp }}/node
        run: npx --yes prettier@3.9.10 --check .

  gate:
    name: ci gate
    # Not always(): a run superseded by a newer one is cancelled, and its gate
    # would report a failure on the same commit the newer run is checking.
    if: ${{ !cancelled() }}
    needs: [actionlint, shellcheck, test, test-bash32, prettier]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job finished as $result"; exit 1 ;;
            esac
          done
