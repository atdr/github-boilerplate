# Reusable: CI for a Python package linted and formatted with ruff and tested
# with pytest.
#
# What pytest measures under coverage lives in pyproject.toml
# ([tool.coverage.run]), not on the command line here, so a developer running
# `pytest --cov` locally measures what CI measures.
#
# A repo with a uv.lock is installed from it (`uv sync --locked`), so CI tests
# exactly the versions the lock pins and fails if the lock is stale. Its tools
# then run through `uv run --no-sync`, which uses that environment as synced
# rather than syncing again with different options. Without a lock, `install`
# runs with pip.
name: python-ci

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'
      python-version:
        description: The single version lint and coverage run on
        type: string
        default: "3.13"
      install:
        description: >-
          Command that installs the package and its dev tools with pip. Ignored
          when the repo has a uv.lock, which is installed with uv instead.
        type: string
        default: pip install -e ".[dev]"
      uv-sync-args:
        description: >-
          Arguments added to `uv sync --locked` in a repo with a uv.lock. The
          default takes every extra, so dev tools kept in an extra (like the
          `.[dev]` pip installs) are there too; dependency groups such as `dev`
          are installed by uv's default either way.
        type: string
        default: --all-extras
      coverage:
        description: Run pytest under coverage and upload coverage.xml to Codecov
        type: boolean
        default: true
      audit:
        description: Run pip-audit (runtime blocking, development advisory)
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
            echo "RUN=uv run --no-sync" >> "$GITHUB_ENV"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          if [ "$UV" = true ]; then
            # Unquoted on purpose: it is a list of arguments.
            # shellcheck disable=SC2086
            uv sync --locked $UV_SYNC_ARGS
          else
            eval "$INSTALL"
          fi
      - run: $RUN ruff check .
      - run: $RUN ruff format --check .

  test:
    # Interpolated, not a fixed string: a matrix job with a static name produces
    # several checks called the same thing.
    name: pytest ${{ matrix.python-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
            echo "RUN=uv run --no-sync" >> "$GITHUB_ENV"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          if [ "$UV" = true ]; then
            # Unquoted on purpose: it is a list of arguments.
            # shellcheck disable=SC2086
            uv sync --locked $UV_SYNC_ARGS
          else
            eval "$INSTALL"
          fi
      - run: $RUN pytest -q

  # Reporting, not a gate: the matrix above is what proves the suite passes.
  # One interpreter, because coverage of the same code on several says the same
  # thing several times.
  coverage:
    name: coverage
    if: inputs.coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
            echo "RUN=uv run --no-sync" >> "$GITHUB_ENV"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          if [ "$UV" = true ]; then
            # Unquoted on purpose: it is a list of arguments.
            # shellcheck disable=SC2086
            uv sync --locked $UV_SYNC_ARGS
          else
            eval "$INSTALL"
          fi
      - run: $RUN pytest -q --cov --cov-report=xml
      # Advisory only: a Codecov outage or a token missing from a fork says
      # nothing about the change under review. The coverage run above stays
      # blocking.
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Separate from the matrix: an audit result reflects the advisory database at
  # a point in time, not the diff under review, and advisories do not depend on
  # the Python version. One interpreter, the one lint runs on.
  #
  # Runtime means [project].dependencies, without extras or dependency groups:
  # what `pip install <package>` gives a user. The development tree is
  # everything the repo can install. With a uv.lock both come from the lock
  # (`uv export`), hashed, so pip-audit checks the pinned versions as they are
  # without resolving anything. Without one, each is installed into a venv of
  # its own (`pip install -e .` and the `install` input) and pip-audit reads
  # what landed there; pip itself is uninstalled first, being the installer
  # rather than a dependency.
  audit:
    name: dependency audit
    if: inputs.audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      # The pip-audit pin lives in this repository, where Dependabot bumps it,
      # so it is fetched at the commit the caller pinned.
      - name: Fetch the pinned pip-audit requirements
        env:
          # job.workflow_sha is this workflow's own commit (the one the caller's
          # @ref resolved to), not the caller's.
          REF: ${{ job.workflow_sha }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/requirements-audit.txt" \
            "https://raw.githubusercontent.com/atdr/github-boilerplate/$REF/scripts/requirements-audit.txt"
      # Into the runner's interpreter, never into what is audited below.
      - run: pip install -r "$RUNNER_TEMP/requirements-audit.txt"
      - name: Resolve runtime and development dependencies
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
        run: |
          out="$RUNNER_TEMP/audit"
          mkdir -p "$out"
          if [ "$UV" = true ]; then
            # --no-emit-local leaves out the project and any path dependency,
            # which are not on PyPI to audit.
            uv export --locked --quiet --format requirements-txt --no-emit-local \
              --no-default-groups -o "$out/runtime.txt"
            uv export --locked --quiet --format requirements-txt --no-emit-local \
              --all-extras --all-groups -o "$out/development.txt"
            for tree in runtime development; do
              # pip-audit refuses a requirements file with nothing in it.
              if grep -q '^[^#[:space:]]' "$out/$tree.txt"; then
                args="--disable-pip -r $out/$tree.txt"
              else
                args=""
              fi
              echo "$(echo "$tree" | tr '[:lower:]' '[:upper:]')_ARGS=$args" >> "$GITHUB_ENV"
            done
          elif [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m venv "$out/runtime"
            "$out/runtime/bin/pip" install --quiet -e .
            python -m venv "$out/development"
            (
              export VIRTUAL_ENV="$out/development" PATH="$out/development/bin:$PATH"
              eval "$INSTALL"
            )
            for tree in runtime development; do
              "$out/$tree/bin/python" -m pip uninstall --quiet --yes pip
              site=$("$out/$tree/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
              echo "$(echo "$tree" | tr '[:lower:]' '[:upper:]')_ARGS=--skip-editable --path $site" >> "$GITHUB_ENV"
            done
          else
            echo "::error title=Nothing to audit::No uv.lock, pyproject.toml or setup.py, so there are no dependencies to audit. Set \`audit: false\` if this repo has none."
            exit 1
          fi
      # Blocking: runtime dependencies are the ones that reach a user. pip-audit
      # has no severity threshold, so any known advisory fails.
      - name: audit runtime dependencies
        run: |
          if [ -z "$RUNTIME_ARGS" ]; then
            echo "No runtime dependencies to audit."
            exit 0
          fi
          # Unquoted on purpose: it is a list of arguments.
          # shellcheck disable=SC2086
          pip-audit --progress-spinner off $RUNTIME_ARGS
      # Advisory: development tooling never ships. The step swallows the exit
      # code itself rather than using continue-on-error, which would leave the
      # runner's bare "Process completed with exit code 1" as the only
      # annotation. ::error rather than ::warning, so it is not scrolled past
      # with the deprecation notices; a Dependabot bump clears it.
      - name: audit development tree (advisory)
        run: |
          if [ -z "$DEVELOPMENT_ARGS" ]; then
            echo "No development dependencies to audit."
            exit 0
          fi
          # Unquoted on purpose: it is a list of arguments.
          # shellcheck disable=SC2086
          if ! pip-audit --progress-spinner off $DEVELOPMENT_ARGS; then
            echo "::error title=Development dependency advisory::pip-audit found an advisory in the development tree. This does not block: development dependencies never reach a user, and the job is green on purpose. Dependabot alerts are the signal of record; the report above says which package."
          fi
