# Reusable: CI for a Python package linted and formatted with ruff and tested
# with pytest.
#
# What pytest measures under coverage lives in pyproject.toml
# ([tool.coverage.run]), not on the command line here, so a developer running
# `pytest --cov` locally measures what CI measures.
#
# A repo with a uv.lock is installed from it (`uv sync --locked`), so CI tests
# exactly the versions the lock pins and fails if the lock is stale. Its tools
# then run through `uv run --no-sync`, which uses that environment as synced
# rather than syncing again with different options. Without a lock, `install`
# runs with pip.
name: python-ci

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'
      python-version:
        description: The single version lint and coverage run on
        type: string
        default: "3.13"
      install:
        description: >-
          Command that installs the package and its dev tools with pip. Ignored
          when the repo has a uv.lock, which is installed with uv instead.
        type: string
        default: pip install -e ".[dev]"
      uv-sync-args:
        description: >-
          Arguments added to `uv sync --locked` in a repo with a uv.lock. The
          default takes every extra, so dev tools kept in an extra (like the
          `.[dev]` pip installs) are there too; dependency groups such as `dev`
          are installed by uv's default either way.
        type: string
        default: --all-extras
      coverage:
        description: Run pytest under coverage and upload coverage.xml to Codecov
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
            echo "RUN=uv run --no-sync" >> "$GITHUB_ENV"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          if [ "$UV" = true ]; then
            # Unquoted on purpose: it is a list of arguments.
            # shellcheck disable=SC2086
            uv sync --locked $UV_SYNC_ARGS
          else
            eval "$INSTALL"
          fi
      - run: $RUN ruff check .
      - run: $RUN ruff format --check .

  test:
    # Interpolated, not a fixed string: a matrix job with a static name produces
    # several checks called the same thing.
    name: pytest ${{ matrix.python-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
            echo "RUN=uv run --no-sync" >> "$GITHUB_ENV"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          if [ "$UV" = true ]; then
            # Unquoted on purpose: it is a list of arguments.
            # shellcheck disable=SC2086
            uv sync --locked $UV_SYNC_ARGS
          else
            eval "$INSTALL"
          fi
      - run: $RUN pytest -q

  # Reporting, not a gate: the matrix above is what proves the suite passes.
  # One interpreter, because coverage of the same code on several says the same
  # thing several times.
  coverage:
    name: coverage
    if: inputs.coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Use uv if the repo has a lockfile
        id: tool
        run: |
          if [ -f uv.lock ]; then
            echo "uv=true" >> "$GITHUB_OUTPUT"
            echo "RUN=uv run --no-sync" >> "$GITHUB_ENV"
          fi
      - if: steps.tool.outputs.uv == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
          UV: ${{ steps.tool.outputs.uv }}
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          if [ "$UV" = true ]; then
            # Unquoted on purpose: it is a list of arguments.
            # shellcheck disable=SC2086
            uv sync --locked $UV_SYNC_ARGS
          else
            eval "$INSTALL"
          fi
      - run: $RUN pytest -q --cov --cov-report=xml
      # Advisory only: a Codecov outage or a token missing from a fork says
      # nothing about the change under review. The coverage run above stays
      # blocking.
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
